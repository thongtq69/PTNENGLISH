<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PTN English Logo Exporter</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@800&family=Inter:wght@700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 4rem;
            border-radius: 2rem;
            box-shadow: 0 20px 50px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 800px;
        }
        #logo-container {
            padding: 2rem;
            background: white;
            display: inline-block;
            border: 1px dashed #e2e8f0;
            border-radius: 1rem;
            margin-bottom: 2rem;
        }
        .logo-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .main-text {
            font-family: 'Playfair Display', serif;
            font-size: 80px;
            font-weight: 900;
            line-height: 1;
            letter-spacing: -0.02em;
        }
        .ptn { color: #C7002B; }
        .english { color: #1e293b; }
        .tagline {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-top: 10px;
            color: #095e7c;
            font-size: 14px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.15em;
        }
        .tagline span {
            display: inline-block;
        }
        .btn {
            background: #C7002B;
            color: white;
            border: none;
            padding: 1rem 2.5rem;
            border-radius: 1rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(199, 0, 43, 0.2);
            filter: brightness(1.1);
        }
        .info {
            margin-top: 2rem;
            color: #64748b;
            font-size: 0.9rem;
        }
        canvas {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 style="margin-bottom: 2rem; font-weight: 900; color: #1e293b;">PTN EXPORT TOOL</h1>
        
        <div id="logo-container">
            <div class="logo-wrap" id="logo-to-export">
                <div class="main-text">
                    <span class="ptn">PTN</span><span class="english"> ENGLISH</span>
                </div>
                <div class="tagline">
                    <span>P</span><span>A</span><span>R</span><span>T</span><span>N</span><span>E</span><span>R</span>
                    <span>&nbsp;</span>
                    <span>T</span><span>O</span>
                    <span>&nbsp;</span>
                    <span>N</span><span>A</span><span>V</span><span>I</span><span>G</span><span>A</span><span>T</span><span>E</span>
                </div>
            </div>
        </div>

        <br>
        <button class="btn" onclick="exportLogo()">Download High-Res PNG (Transparent)</button>
        
        <div class="info">
            This tool generates a high-quality 4000px PNG from the brand's vector system.<br>
            Fonts used: Playfair Display & Inter.
        </div>
    </div>

    <canvas id="export-canvas"></canvas>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script>
        function exportLogo() {
            const element = document.getElementById('logo-to-export');
            const btn = document.querySelector('.btn');
            btn.innerText = "Exporting...";
            
            // Wait for fonts to be fully loaded
            document.fonts.ready.then(() => {
                html2canvas(element, {
                    backgroundColor: null,
                    scale: 4, // 4x scale for high-res
                    logging: false,
                    useCORS: true
                }).then(canvas => {
                    const link = document.createElement('a');
                    link.download = 'ptn_english_logo_transparent.png';
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                    btn.innerText = "Download High-Res PNG (Transparent)";
                });
            });
        }
    </script>
</body>
</html>
